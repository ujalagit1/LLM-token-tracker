<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Analytics Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>📊 Analytics Dashboard</h2>

        <a href="/" class="btn btn-primary">
            Home
        </a>

    </div>

    <div class="row">

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Total Requests</h5>

                    <h2>{{ analytics.total_requests }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Total Tokens</h5>

                    <h2>{{ analytics.total_tokens }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Total Cost</h5>

                    <h2>₹ {{ "%.6f"|format(analytics.total_cost) }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Most Used Model</h5>

                    <h6>{{ model.model }}</h6>

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h5>Token Distribution</h5>

                    <canvas id="tokenChart"></canvas>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h5>Cost Overview</h5>

                    <canvas id="costChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

new Chart(document.getElementById('tokenChart'), {

    type: 'doughnut',

    data: {

        labels: [
            'Input',
            'Output',
            'Thinking'
        ],

        datasets: [{

            data: [
                {{ analytics.total_input_tokens }},
                {{ analytics.total_output_tokens }},
                {{ analytics.total_thinking_tokens }}
            ]

        }]

    }

});

new Chart(document.getElementById('costChart'), {

    type: 'bar',

    data: {

        labels: ['Total Cost'],

        datasets: [{

            label: '₹',

            data: [

                {{ analytics.total_cost }}

            ]

        }]

    }

});

</script>

</body>

</html>S
