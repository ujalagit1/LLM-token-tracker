<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>LLM Token Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2>🤖 LLM Token Tracker</h2>

        </div>

        <div class="card-body">

            <form id="chatForm">

                <div class="mb-3">

                    <label class="form-label">

                        Select Model

                    </label>

                    <select
                        id="model"
                        name="model"
                        class="form-select">

                        <option value="gemini-3.6-flash">

                            Gemini 3.6 Flash

                        </option>

                        <option value="gemini-3.5-flash">

                            Gemini 3.5 Flash

                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Prompt

                    </label>

                    <textarea
                        id="prompt"
                        name="prompt"
                        rows="8"
                        class="form-control"
                        placeholder="Ask anything..."></textarea>

                </div>

                <button
                    id="generateBtn"
                    type="submit"
                    class="btn btn-primary">

                    🚀 Generate

                </button>

                <a
                    href="/history"
                    class="btn btn-secondary ms-2">

                    📜 History

                </a>

                <a
                    href="/analytics"
                    class="btn btn-warning ms-2">

                    📊 Analytics

                </a>

            </form>

            <hr class="my-4">

            <div id="responseArea">

            </div>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
